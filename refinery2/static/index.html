<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>refinery-2 — label + distill</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h1>refinery-2 <span id="proj"></span></h1>
    <p class="sub" id="stats">…</p>
  </div>
  <nav class="tabs">
    <button data-tab="browse" class="on">browse</button>
    <button data-tab="review" id="tab-review">review <span id="qcount"></span></button>
    <button data-tab="sources">sources</button>
    <button data-tab="distill">distill</button>
  </nav>
</header>
<div id="toast" class="hidden"></div>
<main>
  <section id="tab-browse" class="tab">
    <div class="row">
      <select id="task"></select>
      <input id="q" placeholder="search text…">
      <button id="btn-run">run sources</button>
    </div>
    <div class="split">
      <div id="list"></div>
      <div id="detail"><p class="muted">Select a record on the left to label it. Keys 1–4 label classification.</p></div>
    </div>
  </section>
  <section id="tab-review" class="tab hidden">
    <p class="muted">Records where sources disagree or confidence is low. Click to label as golden.</p>
    <div class="split">
      <div id="qlist"></div>
      <div id="qdetail"><p class="muted">Select a record…</p></div>
    </div>
  </section>
  <section id="tab-sources" class="tab hidden">
    <h3>source quality vs golden</h3>
    <pre id="quality" class="card">–</pre>
  </section>
  <section id="tab-distill" class="tab hidden">
    <div class="row">
      <label>min conf <input id="minconf" value="0.8" size="4"></label>
      <button id="btn-distill">train student</button>
    </div>
    <pre id="distill" class="card">–</pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
